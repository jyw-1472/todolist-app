<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 모바일 화면에서도 올바르게 보이도록 뷰포트 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가위바위보 게임</title>
  <!-- 외부 CSS 파일 연결 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>가위바위보</h1>

    <!-- 점수판 영역 -->
    <div class="scoreboard">
      <div class="score-box">
        <span class="score-label">나</span>
        <!-- 사용자 점수: JavaScript에서 이 id를 찾아 숫자를 업데이트함 -->
        <span class="score-number" id="user-score">0</span>
      </div>
      <div class="score-divider">:</div>
      <div class="score-box">
        <span class="score-label">컴퓨터</span>
        <!-- 컴퓨터 점수 -->
        <span class="score-number" id="computer-score">0</span>
      </div>
    </div>

    <!-- 선택 결과 표시 영역 -->
    <div class="choices-display">
      <div class="choice-box">
        <p class="choice-title">내 선택</p>
        <!-- 사용자가 선택한 이모지가 여기에 표시됨 -->
        <div class="choice-emoji" id="user-choice">❓</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="choice-box">
        <p class="choice-title">컴퓨터 선택</p>
        <!-- 컴퓨터가 선택한 이모지가 여기에 표시됨 -->
        <div class="choice-emoji" id="computer-choice">❓</div>
      </div>
    </div>

    <!-- 게임 결과 메시지 (승/패/무승부) -->
    <div class="result-message" id="result-message">버튼을 눌러 시작하세요!</div>

    <!-- 가위, 바위, 보 선택 버튼 -->
    <div class="buttons">
      <!-- data-choice 속성으로 어떤 선택인지 JavaScript에 전달 -->
      <button class="choice-btn" data-choice="scissors">✂️<span>가위</span></button>
      <button class="choice-btn" data-choice="rock">✊<span>바위</span></button>
      <button class="choice-btn" data-choice="paper">✋<span>보</span></button>
    </div>

    <!-- 점수 초기화 버튼 -->
    <button class="reset-btn" id="reset-btn">점수 초기화</button>
  </div>

  <!-- 외부 JavaScript 파일 연결 (body 끝에 두어야 HTML이 먼저 로드됨) -->
  <script src="script.js"></script>
</body>
</html>
